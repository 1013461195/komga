# Docker Compose for Komga with PostgreSQL (Production)
#
# Build and start:
#   cd docker && docker compose up -d --build
#
# View logs:
#   docker compose logs -f komga
#
# Stop:
#   docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: komga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: komga
      POSTGRES_USER: komga
      POSTGRES_PASSWORD: komga123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komga -d komga"]
      interval: 10s
      timeout: 5s
      retries: 5

  komga:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
    image: komga:local
    container_name: komga
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "25600:25600"
    volumes:
      - ../config:/config
      - ../library:/library
    environment:
      KOMGA_CONFIGDIR: /config
      KOMGA_DATABASE_TYPE: postgresql
      KOMGA_DATABASE_FILE: jdbc:postgresql://postgres:5432/komga
      KOMGA_DATABASE_USERNAME: komga
      KOMGA_DATABASE_PASSWORD: komga123
      KOMGA_DATABASE_MAX_POOL_SIZE: "10"
      SPRING_PROFILES_ACTIVE: postgresql
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:25600/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres_data:
    driver: local
